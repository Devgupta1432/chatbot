<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Pixora</title>
  <style>
    :root {
      --bg:#0a0a0a;--surface:#111;--card:#181818;--border:#252525;
      --accent:#6366f1;--accent2:#818cf8;--text:#e8e8e8;--muted:#666;
      --green:#22c55e;--red:#ef4444;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;}
    .logo{font-size:22px;font-weight:800;margin-bottom:32px;}
    .logo span{color:var(--accent);}
    .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:36px 32px;width:100%;max-width:420px;}
    h2{font-size:22px;font-weight:800;margin-bottom:6px;}
    .sub{font-size:14px;color:var(--muted);margin-bottom:28px;}
    .form-group{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;}
    label{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);}
    input{background:var(--bg);border:1.5px solid var(--border);border-radius:8px;padding:11px 14px;font-size:14px;color:var(--text);outline:none;transition:border-color .2s;font-family:inherit;width:100%;}
    input:focus{border-color:var(--accent);}
    input.error{border-color:var(--red);}
    .btn{width:100%;padding:12px;border-radius:8px;border:none;font-size:15px;font-weight:700;cursor:pointer;background:var(--accent);color:#fff;transition:opacity .2s;font-family:inherit;margin-top:8px;}
    .btn:hover{opacity:.85;}
    .btn:disabled{opacity:.5;cursor:not-allowed;}
    .err-msg{font-size:13px;color:var(--red);margin-top:8px;display:none;background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);border-radius:8px;padding:10px 14px;}
    .link-row{text-align:center;font-size:13px;color:var(--muted);margin-top:20px;}
    .link-row a{color:var(--accent2);text-decoration:none;}
    .link-row a:hover{text-decoration:underline;}
    .divider{text-align:center;color:var(--muted);font-size:12px;margin:16px 0;position:relative;}
    .divider::before,.divider::after{content:"";position:absolute;top:50%;width:42%;height:1px;background:var(--border);}
    .divider::before{left:0;} .divider::after{right:0;}
    .btn-google{background:var(--card);color:var(--text);border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;gap:10px;font-size:14px;}
    .btn-google:hover{border-color:var(--accent);}
    .forgot{font-size:12px;color:var(--muted);text-align:right;margin-top:-8px;margin-bottom:8px;cursor:pointer;}
    .forgot:hover{color:var(--accent2);}
  </style>
</head>
<body>
  <div class="logo">⚡ Pixo<span>ra</span></div>
  <div class="card">
    <h2>Welcome back</h2>
    <p class="sub">Log in to manage your chatbot.</p>

    <div id="login-form">
      <div class="form-group">
        <label>Email *</label>
        <input type="email" id="l-email" placeholder="you@yourbusiness.com">
      </div>
      <div class="form-group">
        <label>Password *</label>
        <input type="password" id="l-pass" placeholder="Your password"
               onkeydown="if(event.key==='Enter') login()">
      </div>
      <div class="forgot" onclick="forgotPassword()">Forgot password?</div>
      <div class="err-msg" id="l-error"></div>
      <button class="btn" id="l-btn" onclick="login()">Log In →</button>

      <div class="divider">or</div>

      <button class="btn btn-google" onclick="googleLogin()">
        <svg width="18" height="18" viewBox="0 0 48 48">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        Continue with Google
      </button>
    </div>

    <div class="link-row">New here? <a href="register.html">Create an account →</a></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script>
    const FB_CONFIG = {
      apiKey:"AIzaSyBmX-TR7eA_K_YzY34AwC4x5HmfwtqPN94",
      authDomain:"chatbot-e3cec.firebaseapp.com",
      projectId:"chatbot-e3cec",
      storageBucket:"chatbot-e3cec.firebasestorage.app",
      messagingSenderId:"950464568801",
      appId:"1:950464568801:web:9f7150964b7089048506a0",
    };
    if (!firebase.apps.length) firebase.initializeApp(FB_CONFIG);
    const auth = firebase.auth();
    const db   = firebase.firestore();

    // If already logged in, go straight to dashboard
    auth.onAuthStateChanged(async user => {
      if (user) await redirectToDashboard(user.uid);
    });

    async function redirectToDashboard(uid) {
      const snap = await db.collection("users").doc(uid).get();
      if (snap.exists) {
        const clientId = snap.data().clientId;
        localStorage.setItem("pixora_client_id", clientId);
        window.location.href = "../admin/dashboard.html";
      }
    }

    function showError(msg) {
      const el = document.getElementById("l-error");
      el.textContent = msg; el.style.display = "block";
    }

    async function login() {
      document.getElementById("l-error").style.display = "none";
      const email = document.getElementById("l-email").value.trim();
      const pass  = document.getElementById("l-pass").value;

      document.getElementById("l-email").classList.toggle("error", !email);
      document.getElementById("l-pass").classList.toggle("error", !pass);
      if (!email || !pass) return showError("Email and password are required.");

      const btn = document.getElementById("l-btn");
      btn.disabled = true; btn.textContent = "Logging in…";

      try {
        const cred = await auth.signInWithEmailAndPassword(email, pass);
        await redirectToDashboard(cred.user.uid);
      } catch (e) {
        btn.disabled = false; btn.textContent = "Log In →";
        const msgs = {
          "auth/user-not-found":  "No account found with this email.",
          "auth/wrong-password":  "Incorrect password.",
          "auth/invalid-email":   "Invalid email address.",
          "auth/too-many-requests": "Too many attempts. Try again later.",
        };
        showError(msgs[e.code] || e.message);
      }
    }

    async function googleLogin() {
      try {
        const provider = new firebase.auth.GoogleAuthProvider();
        const cred = await auth.signInWithPopup(provider);
        const uid  = cred.user.uid;

        // Check if user already has a client doc
        const userSnap = await db.collection("users").doc(uid).get();
        if (userSnap.exists) {
          await redirectToDashboard(uid);
        } else {
          // New Google user — create their client doc
          const name     = cred.user.displayName || "My Business";
          const email    = cred.user.email;
          const clientId = await generateClientId(name);
          const widgetId = generateWidgetId();

          await db.collection("clients").doc(clientId).set({
            uid, businessName: name, email, widgetId,
            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          });
          await db.collection("users").doc(uid).set({ clientId });
          localStorage.setItem("pixora_client_id", clientId);
          window.location.href = "../admin/dashboard.html";
        }
      } catch (e) {
        showError(e.message);
      }
    }

    async function forgotPassword() {
      const email = document.getElementById("l-email").value.trim();
      if (!email) return showError("Enter your email above first.");
      try {
        await auth.sendPasswordResetEmail(email);
        document.getElementById("l-error").style.cssText = "display:block;color:var(--green);background:rgba(34,197,94,.08);border-color:rgba(34,197,94,.3);";
        document.getElementById("l-error").textContent = "Password reset email sent!";
      } catch (e) {
        showError(e.message);
      }
    }

    function slugify(name) {
      return name.toLowerCase().replace(/[^a-z0-9\s]/g,"").trim().replace(/\s+/g,"");
    }
    function generateWidgetId() {
      const chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
      let id = "pxt_";
      for (let i = 0; i < 10; i++) id += chars[Math.floor(Math.random() * chars.length)];
      return id;
    }
    async function generateClientId(name) {
      const base = slugify(name);
      const first = await db.collection("clients").doc(base).get();
      if (!first.exists) return base;
      let c = 2;
      while (true) {
        const snap = await db.collection("clients").doc(base + c).get();
        if (!snap.exists) return base + c;
        c++;
      }
    }
  </script>
</body>
</html>
